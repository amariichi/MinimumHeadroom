[project]
name = "vision-worker"
version = "0.1.0"
description = "Camera perception worker for AtomS3R-M12 (frame -> change gate -> VLM -> rolling SQLite memory)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "numpy>=2.0.0",
  "pillow>=10.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
vision-worker = "vision_worker.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_worker"]
