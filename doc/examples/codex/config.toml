# Codex CLI MCP configuration example
# Place at: ~/.codex/config.toml  (or .codex/config.toml within a trusted project)
# Important: top-level key is mcp_servers

[mcp_servers.minimum_headroom]
command = "/ABS/PATH/minimum-headroom/scripts/run-bound-mcp-server.sh"
args = []
env = { "FACE_WS_URL" = "ws://127.0.0.1:8765/ws", "VISION_BASE_URL" = "http://127.0.0.1:8095", "MCP_TOOL_NAME_STYLE" = "underscore" }

# The wrapper preserves MH_FACE_AGENT_ID / MH_FACE_AGENT_LABEL from the current
# agent process or its parent when available, so face_* tools can omit agent_id.
#
# If face-app is bound outside loopback and requires MH_FACE_AUTH_TOKEN, the
# wrapper also forwards MH_FACE_AUTH_TOKEN from the current environment, from a
# parent process, or from MH_FACE_ENV_FILE. The default env file is:
#   ~/.config/minimum-headroom.env
# Keep the real token out of this checked-in config.

# --- Hook bridge (face safety net) ----------------------------------------
# Routes Codex hook events into the face_say + face_event + owner-inbox
# safety net. Requires the new Codex `hooks` system; older Codex installs can
# fall back to the legacy `notify` line at the bottom of this file instead.

[features]
hooks = true   # In Codex < 0.131 the legacy alias `codex_hooks = true` works
               # too but emits a deprecation warning at startup.

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event PermissionRequest"
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/situation-context-hook-codex.mjs"
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event Stop"
timeout = 5

# Legacy fallback (only useful when [features] codex_hooks is unavailable):
# notify = ["/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs", "--runtime", "codex"]

# Review through the SAME launch path in /hooks, inspect each intended MH
# source/command, and trust only those definitions through the official UI.
# Check Active counts, then verify actual delivery to the expected owner inbox.
# Trust hashes persist in normal ~/.codex/config.toml [hooks.state]; changes to
# definition/source/path can require review again. User/project/session sources
# add together, so installing this file does not replace old global hooks.
# Do not overwrite existing config/model/auth/permission settings or use blanket
# trust as a connectivity check. Details: doc/hook-bridge/README.md.

# Observe input waits; these hooks emit no approval decisions. Codex 0.163 baseline.
[[hooks.PreToolUse]]
matcher = "request_user_input"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event PreToolUse"
timeout = 5

[[hooks.PostToolUse]]
matcher = ".*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event PostToolUse"
timeout = 5

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event UserPromptSubmit"
timeout = 5

# Response interruption/session exit is distinct from explicit helper done.
[[hooks.Interrupt]]
[[hooks.Interrupt.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event Interrupt"
timeout = 3

# Response interruption/session exit is distinct from explicit helper done.
[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "/ABS/PATH/minimum-headroom/scripts/mh-hook.mjs --runtime codex --event SessionEnd"
timeout = 3
