[project]
name = "silero-vad-worker"
version = "0.1.0"
description = "Local Silero VAD worker for minimum-headroom AtomS3R audio bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "numpy>=2.0.0",
  "silero-vad>=5.1.0",
  "torch>=2.2.0",
]

[project.scripts]
silero-vad-worker = "silero_vad_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silero_vad_worker"]
