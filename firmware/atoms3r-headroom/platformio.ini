[env:m5stack-atoms3r]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 115200

; Patch the ESP32 Arduino WebServer raw-upload loop so audio POSTs do not wait
; the full 5 s WiFiClient timeout on the final partial chunk. Idempotent.
; See README.md ("WebServer library patch") for the rationale.
extra_scripts = pre:scripts/apply_webserver_patch.py

build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3
  -DWEBSOCKETS_TCP_TIMEOUT=750
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.6.1

; AtomS3R-M12 variant: same controller + OV3660 camera, no LCD/IMU/screen button.
; Shares every source except the faced entry point (main.cpp) and the LCD
; renderer (face_renderer.cpp), which are dropped via build_src_filter. The
; esp32-camera driver is bundled in the arduino-esp32 core (libesp32-camera.a),
; so no extra lib_dep is needed. The faced env above is untouched.
[env:atoms3r-m12]
extends = env:m5stack-atoms3r
build_flags =
  ${env:m5stack-atoms3r.build_flags}
  -DHEADROOM_M12
  -DHEADROOM_NO_DISPLAY
build_src_filter =
  +<*>
  -<main.cpp>
  -<face_renderer.cpp>
; Pre-build hooks. extends does not merge extra_scripts, so the parent's
; WebServer patch is repeated here alongside the M12-only M5Unified board patch
; (force board_M5AtomS3RCam so the Echo Base uses the atomic_echo audio path).
extra_scripts =
  pre:scripts/apply_webserver_patch.py
  pre:scripts/apply_m5unified_board_patch.py
